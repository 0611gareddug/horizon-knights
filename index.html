<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5d8fd1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="호라이즌 나이츠 - 하늘섬 픽셀 액션 RPG" />
    <title>호라이즌 나이츠</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%235d8fd1'/%3E%3Cpath d='M7 2h2v8H7z' fill='%23e8eef7'/%3E%3Cpath d='M4 10h8v2H4z' fill='%23c9a227'/%3E%3Cpath d='M7 12h2v3H7z' fill='%236b4a2b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="ui">
        <div id="loading" class="screen">
          <div class="logo-sm">HORIZON KNIGHTS</div>
          <div class="bar"><div class="bar-fill" id="loading-fill"></div></div>
          <div class="loading-text" id="loading-text">하늘섬을 띄우는 중…</div>
        </div>

        <div id="title" class="screen hidden">
          <div class="title-box">
            <div class="logo">
              <span class="logo-main">호라이즌 나이츠</span>
              <span class="logo-sub">HORIZON KNIGHTS</span>
            </div>
            <div class="menu">
              <button class="btn btn-primary" id="btn-start">시작하기</button>
              <button class="btn" disabled title="준비 중">협동 <small>준비 중</small></button>
              <button class="btn" disabled title="준비 중">랭킹 <small>준비 중</small></button>
              <button class="btn" id="btn-title-settings">설정</button>
            </div>
            <div class="title-foot">개발 버전 0.1 · 1단계 미리보기</div>
          </div>
        </div>

        <div id="hud" class="hidden">
          <div class="hud-tl">
            <div class="hp">
              <div class="hp-label">체력</div>
              <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
            </div>
            <div class="zone-name" id="zone-name">초원 · 시험 구역</div>
          </div>
          <div class="hud-tr">
            <button class="icon-btn" id="btn-pause" aria-label="일시정지">
              <svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M2 1h1v6H2zM5 1h1v6H5z" fill="currentColor" /></svg>
            </button>
            <button class="icon-btn" id="btn-fullscreen" aria-label="전체화면">
              <svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z" fill="currentColor" /></svg>
            </button>
          </div>
          <div class="fps hidden" id="fps"></div>
          <div class="help" id="help">
            <b>조작</b>
            <span class="pc-only">WASD 이동 · Space 구르기 · Esc 일시정지</span>
            <span class="touch-only">왼쪽 화면 드래그로 이동 · 구르기 버튼</span>
          </div>
        </div>

        <div id="touch" class="hidden">
          <div id="joy-zone"></div>
          <div id="joy" class="hidden"><div id="joy-knob"></div></div>
          <div class="touch-buttons">
            <button class="tbtn tbtn-big" id="tb-attack" disabled><span>공격</span><small>2단계</small></button>
            <button class="tbtn tbtn-roll" id="tb-roll"><span>구르기</span></button>
          </div>
        </div>

        <div id="pause" class="screen dim hidden">
          <div class="panel">
            <div class="panel-title">일시정지</div>
            <button class="btn btn-primary" id="btn-resume">계속하기</button>
            <button class="btn" id="btn-settings">설정</button>
            <button class="btn" id="btn-to-title">타이틀로</button>
          </div>
        </div>

        <div id="settings" class="screen dim hidden">
          <div class="panel panel-wide">
            <div class="panel-title">설정</div>
            <div class="settings-grid">
              <label>그래픽 품질
                <select id="set-quality">
                  <option value="auto">자동</option>
                  <option value="low">낮음</option>
                  <option value="mid">보통</option>
                  <option value="high">높음</option>
                </select>
              </label>
              <label>최대 FPS
                <select id="set-fps">
                  <option value="60">60</option>
                  <option value="30">30</option>
                </select>
              </label>
              <label class="check"><input type="checkbox" id="set-showfps" /> FPS 표시</label>
              <label class="check"><input type="checkbox" id="set-shake" checked /> 화면 흔들림</label>
              <label class="check"><input type="checkbox" id="set-vibrate" checked /> 진동</label>
              <label>글자 크기
                <select id="set-fontscale">
                  <option value="0.9">90%</option>
                  <option value="1" selected>100%</option>
                  <option value="1.15">115%</option>
                  <option value="1.3">130%</option>
                  <option value="1.5">150%</option>
                </select>
              </label>
            </div>
            <div class="settings-note">사운드, 키 설정, 버튼 편집, 색각 보정은 다음 단계에서 추가돼요.</div>
            <button class="btn btn-primary" id="btn-settings-close">닫기</button>
          </div>
        </div>

        <div id="toast"></div>

        <div id="rotate" class="screen">
          <div class="rotate-icon"></div>
          <div>가로로 돌려주세요</div>
        </div>

        <div id="guard" class="screen dim hidden">
          <div class="panel">
            <div class="panel-title">일시정지됨</div>
            <div>개발자 도구가 감지되어 게임을 멈췄어요.<br />개발자 도구를 닫으면 계속할 수 있어요.</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
